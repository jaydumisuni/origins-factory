[package]
name = "originsd"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
axum = { version = "=0.7.9", features = ["json", "ws"] }
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std"] }
hex = "=0.4.3"
indexmap = "=2.7.1"
origins-contracts = { path = "../origins-contracts" }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.134"
sha2 = "=0.10.8"
tokio = { version = "=1.42.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.17"
url = "=2.5.0"
uuid = { version = "=1.11.0", features = ["v4"] }
