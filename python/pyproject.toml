[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "origins-contracts"
version = "0.1.0"
description = "Origins Factory contract spine"
requires-python = ">=3.10"
dependencies = ["websockets==16.1.1"]

[tool.setuptools]
packages = ["origins_contracts", "origins_integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
