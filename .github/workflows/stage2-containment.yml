name: Stage-2 Authority Containment

on:
  push:
    branches:
      - impl/stage2-authority-runtime-v1
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stage2-containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containment-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Generate exact dependency lock
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Reject Stage-2 warnings across host workspace
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Prove authority and containment runtime
        run: cargo test --locked --manifest-path rust/Cargo.toml -p originsd --lib --test stage2_authority_runtime

      - name: Compile native sandbox for host OS
        run: cargo build --locked --manifest-path rust/Cargo.toml -p origins-native-sandbox --all-targets

      - name: Compile originsd for host OS
        run: cargo build --locked --manifest-path rust/Cargo.toml -p originsd
