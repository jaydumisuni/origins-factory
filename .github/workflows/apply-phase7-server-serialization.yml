name: Apply Phase 7 Server Serialization

on:
  push:
    branches: [build/phase7-capability-evolution]
    paths:
      - "tools/apply_phase7_server_serialization.py"
      - ".github/workflows/apply-phase7-server-serialization.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply mutation serialization
        run: python tools/apply_phase7_server_serialization.py

      - name: Verify Phase 7
        run: |
          python -m py_compile python/origins_integration/phase7_server.py
          git diff --check
          python -m pip install --disable-pip-version-check -e ./python pytest
          python -m pytest -q python/tests/test_phase7_*.py

      - name: Commit server hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/origins_integration/phase7_server.py
          git diff --cached --quiet && { echo "No server patch required"; exit 0; }
          git commit -m "Phase 7: serialize controlled mutation transitions"
          git push origin HEAD:build/phase7-capability-evolution
