name: Phase 7 Capability Evolution

on:
  pull_request:
    branches: [main]
    paths:
      - "CURRENT_STATE.md"
      - "AI_HANDOFF.md"
      - "proof/phase7-*.md"
      - "python/origins_integration/capability_evolution.py"
      - "python/origins_integration/phase7_runtime.py"
      - "python/origins_integration/phase7_server.py"
      - "python/tests/test_phase7_*.py"
      - "tools/prove_phase7_*.py"
      - "workspace/**"
      - ".github/workflows/phase7-capability-evolution.yml"
  push:
    branches: [build/phase7-capability-evolution]
    paths:
      - "CURRENT_STATE.md"
      - "AI_HANDOFF.md"
      - "proof/phase7-*.md"
      - "python/origins_integration/capability_evolution.py"
      - "python/origins_integration/phase7_runtime.py"
      - "python/origins_integration/phase7_server.py"
      - "python/tests/test_phase7_*.py"
      - "tools/prove_phase7_*.py"
      - "workspace/**"
      - ".github/workflows/phase7-capability-evolution.yml"

permissions:
  contents: write

jobs:
  apply-canary-hardening:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Bind canary Session to reviewed candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("python/origins_integration/phase7_runtime.py")
          text = path.read_text(encoding="utf-8")
          old = '''        gap = _mapping(record, "gap")
          candidate = _mapping(record, "candidate")
          session = self.origins_client.wait_session(session_id)
          output = self.origins_client.get_session_output(session_id)
          if session.get("state") != "completed" or session.get("exit_code") != 0 or bool(session.get("output_truncated")):
              raise Phase7RuntimeError("canary Session must complete successfully without truncation")
          proof = {
              "session_id": session_id,
              "session_stdout_sha256": session.get("stdout_sha256"),
              "session_stderr_sha256": session.get("stderr_sha256"),
              "output": output,
          }
          '''
          new = '''        gap = _mapping(record, "gap")
          candidate = _mapping(record, "candidate")
          repository_id = str(candidate.get("repository_id") or "")
          if not repository_id:
              raise Phase7RuntimeError("candidate repository_id is missing")
          repository = self.origins_client.refresh_repository(repository_id)
          repository_diff = self.origins_client.get_repository_diff(repository_id, kind="unstaged")
          session = self.origins_client.wait_session(session_id)
          canary_binding = _validate_canary_binding(gap, candidate, session, repository, repository_diff)
          output = self.origins_client.get_session_output(session_id)
          if session.get("state") != "completed" or session.get("exit_code") != 0 or bool(session.get("output_truncated")):
              raise Phase7RuntimeError("canary Session must complete successfully without truncation")
          proof = {
              "session_id": session_id,
              "session_stdout_sha256": session.get("stdout_sha256"),
              "session_stderr_sha256": session.get("stderr_sha256"),
              "candidate_binding": canary_binding,
              "output": output,
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"canary method patch anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = '''def _candidate_change_proof(before: Mapping[str, object], after: Mapping[str, object], diff: Mapping[str, object]) -> dict[str, object]:
          '''
          helper = '''def _validate_canary_binding(
              gap: Mapping[str, object],
              candidate: Mapping[str, object],
              session: Mapping[str, object],
              repository: Mapping[str, object],
              diff: Mapping[str, object],
          ) -> dict[str, object]:
              candidate_repository_id = str(candidate.get("repository_id") or "")
              repository_id = str(repository.get("repository_id") or "")
              if not candidate_repository_id or repository_id != candidate_repository_id:
                  raise Phase7RuntimeError("canary Repository identity does not match the reviewed candidate")
              workspace_id = str(gap.get("workspace_id") or "")
              if not workspace_id or repository.get("workspace_id") != workspace_id:
                  raise Phase7RuntimeError("candidate Repository is not owned by the original Mission Workspace")
              if session.get("workspace_id") != workspace_id:
                  raise Phase7RuntimeError("canary Session is not owned by the original Mission Workspace")
              worktree_root = str(repository.get("worktree_root") or "")
              if not worktree_root or session.get("workspace_root") != worktree_root:
                  raise Phase7RuntimeError("canary Session did not execute in the reviewed candidate worktree")
              expected_head = str(candidate.get("repository_head_oid") or "")
              if not expected_head or repository.get("head_oid") != expected_head:
                  raise Phase7RuntimeError("candidate Repository HEAD changed after review")
              expected_status = str(candidate.get("repository_status_sha256") or "")
              if len(expected_status) != 64 or repository.get("status_sha256") != expected_status:
                  raise Phase7RuntimeError("candidate Repository status changed after review")
              if diff.get("kind") != "unstaged" or bool(diff.get("truncated")):
                  raise Phase7RuntimeError("canary requires the complete reviewed unstaged candidate diff")
              expected_diff = str(candidate.get("repository_diff_sha256") or "")
              expected_bytes = candidate.get("repository_diff_bytes")
              if len(expected_diff) != 64 or diff.get("sha256") != expected_diff:
                  raise Phase7RuntimeError("candidate Repository diff changed after review")
              if isinstance(expected_bytes, bool) or not isinstance(expected_bytes, int) or expected_bytes < 1:
                  raise Phase7RuntimeError("candidate Repository diff byte count is malformed")
              if diff.get("complete_bytes") != expected_bytes:
                  raise Phase7RuntimeError("candidate Repository diff size changed after review")
              return {
                  "repository_id": candidate_repository_id,
                  "workspace_id": workspace_id,
                  "worktree_root": worktree_root,
                  "repository_head_oid": expected_head,
                  "repository_status_sha256": expected_status,
                  "repository_diff_sha256": expected_diff,
                  "repository_diff_bytes": expected_bytes,
              }


          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"canary helper anchor count={text.count(anchor)}")
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding="utf-8")

          Path("python/tests/test_phase7_canary_binding.py").write_text('''from __future__ import annotations

import pytest

from origins_integration.phase7_runtime import Phase7RuntimeError, _validate_canary_binding

D = "d" * 64
E = "e" * 64


def values() -> tuple[dict[str, object], dict[str, object], dict[str, object], dict[str, object], dict[str, object]]:
    gap = {"workspace_id": "workspace-7"}
    candidate = {
        "repository_id": "repo-7",
        "repository_head_oid": "abc123",
        "repository_status_sha256": D,
        "repository_diff_sha256": E,
        "repository_diff_bytes": 42,
    }
    session = {"workspace_id": "workspace-7", "workspace_root": "/tmp/candidate"}
    repository = {
        "repository_id": "repo-7",
        "workspace_id": "workspace-7",
        "worktree_root": "/tmp/candidate",
        "head_oid": "abc123",
        "status_sha256": D,
    }
    diff = {"kind": "unstaged", "truncated": False, "sha256": E, "complete_bytes": 42}
    return gap, candidate, session, repository, diff


def test_canary_binding_accepts_exact_reviewed_candidate() -> None:
    binding = _validate_canary_binding(*values())
    assert binding["repository_id"] == "repo-7"
    assert binding["repository_diff_sha256"] == E


@pytest.mark.parametrize(
    ("target", "field", "value", "message"),
    [
        ("session", "workspace_id", "other", "original Mission Workspace"),
        ("session", "workspace_root", "/tmp/other", "reviewed candidate worktree"),
        ("repository", "workspace_id", "other", "original Mission Workspace"),
        ("repository", "head_oid", "changed", "HEAD changed"),
        ("repository", "status_sha256", "f" * 64, "status changed"),
        ("diff", "sha256", "f" * 64, "diff changed"),
        ("diff", "complete_bytes", 43, "diff size changed"),
    ],
)
def test_canary_binding_rejects_wrong_session_or_changed_candidate(
    target: str, field: str, value: object, message: str
) -> None:
    gap, candidate, session, repository, diff = values()
    objects = {"session": session, "repository": repository, "diff": diff}
    objects[target][field] = value
    with pytest.raises(Phase7RuntimeError, match=message):
        _validate_canary_binding(gap, candidate, session, repository, diff)


def test_canary_binding_rejects_truncated_diff() -> None:
    gap, candidate, session, repository, diff = values()
    diff["truncated"] = True
    with pytest.raises(Phase7RuntimeError, match="complete reviewed"):
        _validate_canary_binding(gap, candidate, session, repository, diff)
''', encoding="utf-8")
          PY
          python -m py_compile python/origins_integration/phase7_runtime.py python/tests/test_phase7_canary_binding.py
          git diff --check
      - name: Commit reviewed hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/origins_integration/phase7_runtime.py python/tests/test_phase7_canary_binding.py
          git commit -m "Phase 7: bind canary to reviewed candidate"
          git push origin HEAD:build/phase7-capability-evolution

  backend-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exact Python plane
        run: python -m pip install --disable-pip-version-check -e ./python pytest

      - name: Compile Phase 7 plane and proof tools
        run: >-
          python -m compileall -q python/origins_integration python/tests
          && if ls tools/prove_phase7_*.py >/dev/null 2>&1; then python -m py_compile tools/prove_phase7_*.py; fi

      - name: Prove controlled capability evolution
        run: python -m pytest -q python/tests/test_phase7_*.py

      - name: Prove authority is not self-expanded
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("python/origins_integration/phase7_runtime.py").read_text(encoding="utf-8")
          server = Path("python/origins_integration/phase7_server.py").read_text(encoding="utf-8")
          if '"runtime_authority_expansion": False' not in text:
              raise SystemExit("Phase 7 does not pin runtime authority expansion false")
          for forbidden in ("owner_approved", "approval_state", "self_approve", "runtime_authority_activated"):
              if forbidden not in server:
                  raise SystemExit(f"Phase 7 server is missing client authority rejection for {forbidden}")
          print("PHASE7_NO_SELF_AUTHORITY_OK")
          PY

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Install Workspace dependencies
        run: npm ci

      - name: Typecheck Workspace
        run: npm run typecheck

      - name: Run Workspace tests
        run: npm test

      - name: Build Workspace production bundle
        run: npm run build
