name: Phase 6 Device Read-Only Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "CURRENT_STATE.md"
      - "AI_HANDOFF.md"
      - "proof/phase6-*.md"
      - "python/origins_integration/device_readonly.py"
      - "python/origins_integration/phase6_server.py"
      - "python/tests/test_phase6_*.py"
      - "tools/prove_phase6_*.py"
      - "workspace/**"
      - ".github/workflows/phase6-device-readonly.yml"
  push:
    branches:
      - "build/phase6-device-readonly-integration"
    paths:
      - "CURRENT_STATE.md"
      - "AI_HANDOFF.md"
      - "proof/phase6-*.md"
      - "python/origins_integration/device_readonly.py"
      - "python/origins_integration/phase6_server.py"
      - "python/tests/test_phase6_*.py"
      - "tools/prove_phase6_*.py"
      - "workspace/**"
      - ".github/workflows/phase6-device-readonly.yml"

permissions:
  contents: read

jobs:
  backend-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exact Python plane
        run: python -m pip install --disable-pip-version-check -e ./python pytest

      - name: Compile Phase 6 plane and target-host proofs
        run: >-
          python -m compileall -q python/origins_integration python/tests
          && python -m py_compile
          tools/prove_phase6_device_readonly.py
          tools/prove_phase6_workspace_ui.py

      - name: Prove read-only owner boundaries, reconnect, and X-Ray integrity
        env:
          PYTHONPATH: python
        run: python -m pytest -q python/tests/test_phase6_*.py

      - name: Reject any mounted Gateway mutation command
        env:
          PYTHONPATH: python
        run: |
          python - <<'PY'
          from origins_integration.device_readonly import READ_ONLY_GATEWAY_COMMANDS
          forbidden = {
              "open_physical_session", "close_physical_session", "record_endpoint",
              "open_operation", "transition_operation", "resume_operation",
              "register_provider", "publish_contract", "register_worker",
              "heartbeat_worker", "sweep_workers", "shutdown",
          }
          overlap = READ_ONLY_GATEWAY_COMMANDS & forbidden
          if overlap:
              raise SystemExit(f"Phase 6 mounted mutating Gateway commands: {sorted(overlap)}")
          print("PHASE6_GATEWAY_READ_ONLY_OK")
          PY

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Install Workspace dependencies
        run: npm ci

      - name: Typecheck Phase 6 Workspace
        run: npm run typecheck

      - name: Run Workspace tests
        run: npm test

      - name: Build Workspace production bundle
        run: npm run build
