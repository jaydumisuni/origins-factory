name: Origins v1 Hunter secret presence probe

on:
  push:
    branches: [proof/v1-live-kratos-execution]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report canonical secret presence only
        shell: bash
        env:
          ORIGINS_HUNTER_TOKEN: ${{ secrets.ORIGINS_HUNTER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ORIGINS_HUNTER_TOKEN:-}" ]; then
            echo 'ORIGINS_HUNTER_TOKEN_PRESENT=PASS'
          else
            echo 'ORIGINS_HUNTER_TOKEN_PRESENT=MISSING'
            exit 72
          fi
