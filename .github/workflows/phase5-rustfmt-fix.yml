name: Phase 5 Rustfmt Fix

on:
  push:
    branches: [build/phase5-oracle-lumi-applications]

permissions:
  contents: write

concurrency:
  group: phase5-rustfmt-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Rust 1.75 formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0

      - name: Format Rust and commit formatter-only delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- rust; then
            echo "No Rust formatting delta required."
            exit 0
          fi
          git diff --check -- rust
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "Format Phase 5 Rust"
          git push origin "HEAD:${GITHUB_REF_NAME}"
