name: Apply Phase 7 Engineering Recovery

on:
  push:
    branches: [build/phase7-capability-evolution]
    paths:
      - "tools/apply_phase7_engineering_recovery.py"
      - ".github/workflows/apply-phase7-engineering-recovery.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Correct Workspace recovery anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_phase7_engineering_recovery.py")
          text = path.read_text(encoding="utf-8")
          old = '''def patch_ui() -> None:
              text = UI.read_text(encoding="utf-8")
              text = replace_once(
                  text,
                  '  const canImplement = selected?.state === "upgrade_operation_ready" && engApproved;\\n',
                  '  const canImplement = (selected?.state === "upgrade_operation_ready" || selected?.state === "engineering_started") && engApproved;\\n',
                  "engineering recovery UI state",
              )
              text = text.replace("Implement candidate", "Implement / recover candidate", 1)
              UI.write_text(text, encoding="utf-8")
          '''
          new = '''def patch_ui() -> None:
              text = UI.read_text(encoding="utf-8")
              text = replace_once(
                  text,
                  '              {state === "upgrade_operation_ready" && <div className="phase7-engineering">\\n',
                  '              {(state === "upgrade_operation_ready" || state === "engineering_started") && <div className="phase7-engineering">\\n',
                  "engineering recovery UI state",
              )
              text = text.replace("Run CodeOps + Sergeant", "Run / recover CodeOps + Sergeant", 1)
              UI.write_text(text, encoding="utf-8")
          '''
          if old not in text:
              raise SystemExit("stale UI recovery patch block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply engineering recovery
        run: python tools/apply_phase7_engineering_recovery.py

      - name: Verify Python recovery
        run: |
          python -m py_compile \
            python/origins_integration/capability_evolution.py \
            python/origins_integration/intelligence_runtime.py \
            python/origins_integration/phase7_runtime.py \
            python/tests/test_phase7_capability_evolution.py \
            python/tests/test_phase7_candidate_proof.py
          git diff --check
          python -m pip install --disable-pip-version-check -e ./python pytest
          python -m pytest -q python/tests/test_phase7_*.py

      - name: Verify Workspace recovery surface
        working-directory: workspace
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit engineering recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            python/origins_integration/capability_evolution.py \
            python/origins_integration/intelligence_runtime.py \
            python/origins_integration/phase7_runtime.py \
            python/tests/test_phase7_capability_evolution.py \
            python/tests/test_phase7_candidate_proof.py \
            workspace/src/Phase7App.tsx
          git diff --cached --quiet && { echo "No recovery patch required"; exit 0; }
          git commit -m "Phase 7: recover interrupted candidate engineering"
          git push origin HEAD:build/phase7-capability-evolution
