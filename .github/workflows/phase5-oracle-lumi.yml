name: Phase 5 Oracle Lumi Applications

on:
  pull_request:
    branches: [main]
    paths:
      - "CURRENT_STATE.md"
      - "AI_HANDOFF.md"
      - "contracts/**"
      - "python/origins_contracts/**"
      - "python/origins_integration/phase5_*.py"
      - "python/origins_integration/oracle_live.py"
      - "python/tests/test_phase5_*.py"
      - "python/tests/test_oracle_live.py"
      - "python/pyproject.toml"
      - "rust/origins-contracts/**"
      - "rust/originsd/src/applications.rs"
      - "rust/originsd/src/artifacts.rs"
      - "rust/originsd/src/lib.rs"
      - "rust/originsd/Cargo.toml"
      - "typescript/contracts.ts"
      - "tools/prove_phase5_*.py"
      - "workspace/**"
      - ".github/workflows/phase5-oracle-lumi.yml"
  push:
    branches:
      - "build/phase5-oracle-lumi-applications"
    paths:
      - "CURRENT_STATE.md"
      - "AI_HANDOFF.md"
      - "contracts/**"
      - "python/**"
      - "rust/**"
      - "typescript/contracts.ts"
      - "tools/prove_phase5_*.py"
      - "workspace/**"
      - ".github/workflows/phase5-oracle-lumi.yml"

permissions:
  contents: read

jobs:
  backend-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exact Python plane
        run: python -m pip install --disable-pip-version-check -e ./python pytest

      - name: Compile Phase 5 Python plane and host proofs
        run: >-
          python -m compileall -q python/origins_integration python/origins_contracts python/tests
          && python -m py_compile
          tools/prove_phase5_oracle_remote.py
          tools/prove_phase5_workspace_ui.py

      - name: Run Phase 5 owner and remote-transfer proofs
        env:
          PYTHONPATH: python
        run: >-
          python -m pytest -q
          python/tests/test_phase5_runtime.py
          python/tests/test_oracle_live.py

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Generate exact Rust dependency lock
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Reject Rust warnings
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

  workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Install Workspace dependencies
        run: npm ci

      - name: Typecheck Phase 5 Workspace
        run: npm run typecheck

      - name: Run Workspace tests
        run: npm test

      - name: Build Workspace production bundle
        run: npm run build
