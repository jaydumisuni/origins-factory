name: Origins v1 Hunter Secret Presence

on:
  push:
    branches: [proof/v1-live-kratos-execution]
    paths:
      - ".github/workflows/v1-hunter-secret-presence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check canonical Hunter owner secret presence only
        shell: bash
        env:
          ORIGINS_HUNTER_TOKEN: ${{ secrets.ORIGINS_HUNTER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${ORIGINS_HUNTER_TOKEN:-}" ]]; then
            echo 'ORIGINS_HUNTER_TOKEN_SECRET_PRESENT=true'
          else
            echo 'ORIGINS_HUNTER_TOKEN_SECRET_PRESENT=false'
          fi
