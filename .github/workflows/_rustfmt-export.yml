name: Rustfmt Export

on:
  push:
    branches: [tooling/rustfmt-export-02080e0b]
    paths:
      - ".github/workflows/_rustfmt-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up exact Rust 1.75 proof toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Apply exact Clippy corrections
        shell: python
        run: |
          from pathlib import Path
          path = Path("rust/originsd/src/installed.rs")
          lines = path.read_text(encoding="utf-8").splitlines()
          first = "if relative.as_os_str().is_empty() || !candidate.is_file() {"
          matches = [i for i, line in enumerate(lines) if line.strip() == first]
          if len(matches) != 1:
              raise SystemExit(f"expected one serve_static Clippy expression, got {len(matches)}")
          i = matches[0]
          expected = [
              first,
              "if candidate.extension().is_none() {",
              'candidate = state.workspace_root.join("index.html");',
              "}",
              "}",
          ]
          if [line.strip() for line in lines[i:i+5]] != expected:
              raise SystemExit("serve_static block shape changed")
          lines[i:i+5] = [
              "    if (relative.as_os_str().is_empty() || !candidate.is_file())",
              "        && candidate.extension().is_none()",
              "    {",
              '        candidate = state.workspace_root.join("index.html");',
              "    }",
          ]
          second = "if resolved_data.starts_with(&resolved_exe) {"
          matches = [j for j, line in enumerate(lines) if line.strip() == second]
          if len(matches) != 1:
              raise SystemExit(f"expected one starts_with borrow, got {len(matches)}")
          lines[matches[0]] = "        if resolved_data.starts_with(resolved_exe) {"
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Format lint test and hash exact correction
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked -p originsd --manifest-path rust/Cargo.toml
          git diff --check
          sha256sum rust/originsd/src/installed.rs rust/originsd/src/main.rs
          wc -c rust/originsd/src/installed.rs rust/originsd/src/main.rs
      - name: Commit exact proven source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add rust/originsd/src/installed.rs rust/originsd/src/main.rs
          git diff --cached --check
          git commit -m "fix(windows): satisfy Rust 1.75 warning gate [skip ci]"
          git push origin HEAD:tooling/rustfmt-export-02080e0b
