name: Rustfmt Export

on:
  push:
    branches: [tooling/rustfmt-export-02080e0b]
    paths:
      - ".github/workflows/_rustfmt-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Hash proven Rust files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum rust/originsd/src/installed.rs rust/originsd/src/main.rs
          wc -c rust/originsd/src/installed.rs rust/originsd/src/main.rs
