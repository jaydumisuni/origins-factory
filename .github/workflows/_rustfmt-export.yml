name: Rustfmt Export

on:
  push:
    branches: [tooling/rustfmt-export-02080e0b]
    paths:
      - ".github/workflows/_rustfmt-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Rust 1.75 formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0
          rustc --version
          cargo --version
          rustfmt --version
      - name: Apply exact Rust 1.75 lifetime correction
        shell: python
        run: |
          from pathlib import Path
          path = Path("rust/originsd/src/installed.rs")
          text = path.read_text(encoding="utf-8")
          old = '    base.set_path(if relative.is_empty() { "/" } else { &format!("/{relative}") });\n'
          new = '''    let target_path = if relative.is_empty() {
              "/".to_owned()
          } else {
              format!("/{relative}")
          };
          base.set_path(&target_path);
          '''
          if text.count(old) != 1:
              raise SystemExit("expected proxy_url lifetime expression not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Format and prove Rust correction
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo test --locked -p originsd --manifest-path rust/Cargo.toml
      - name: Commit exact formatted Rust files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add rust/originsd/src/installed.rs rust/originsd/src/main.rs
          git diff --cached --check
          git commit -m "fix(windows): support Rust 1.75 runtime proof [skip ci]"
          git push origin HEAD:tooling/rustfmt-export-02080e0b
