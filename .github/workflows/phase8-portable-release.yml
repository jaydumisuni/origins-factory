name: Phase 8 Portable Release

on:
  pull_request:
    branches: [main]
    paths:
      - "release/**"
      - "tools/build_phase8_release.py"
      - "tools/prove_phase8_release.py"
      - "tools/test_phase8_release.py"
      - "rust/**"
      - "python/**"
      - "workspace/**"
      - ".github/workflows/phase8-portable-release.yml"
  push:
    branches: [build/phase8-portable-release]
    paths:
      - "release/**"
      - "tools/build_phase8_release.py"
      - "tools/prove_phase8_release.py"
      - "tools/test_phase8_release.py"
      - "rust/**"
      - "python/**"
      - "workspace/**"
      - ".github/workflows/phase8-portable-release.yml"

permissions:
  contents: read

jobs:
  portable-release-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Prepare Python wheel backend
        run: python -m pip install --disable-pip-version-check "setuptools>=75"

      - name: Compile release tooling
        run: python -m py_compile tools/build_phase8_release.py tools/prove_phase8_release.py tools/test_phase8_release.py

      - name: Run release contract and adversarial tests
        run: python -m unittest -v tools/test_phase8_release.py

      - name: Build exact-head portable candidate outside source checkout
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/origins-phase8-release"
          rm -rf "$out"
          mkdir -p "$out"
          python tools/build_phase8_release.py \
            --output "$out" \
            --expected-head "${GITHUB_SHA}" \
            | tee "${RUNNER_TEMP}/origins-phase8-build.json"
          archive="$(find "$out" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          checksum="$(find "$out" -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          test -n "$archive"
          test -n "$checksum"
          printf '%s\n' "$archive" > "${RUNNER_TEMP}/origins-phase8-archive-path"
          printf '%s\n' "$checksum" > "${RUNNER_TEMP}/origins-phase8-checksum-path"

      - name: Independently unpack and prove released runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat "${RUNNER_TEMP}/origins-phase8-archive-path")"
          checksum="$(cat "${RUNNER_TEMP}/origins-phase8-checksum-path")"
          python tools/prove_phase8_release.py \
            --archive "$archive" \
            --checksum "$checksum" \
            --expected-head "${GITHUB_SHA}" \
            | tee "${RUNNER_TEMP}/origins-phase8-proof.json"

      - name: Prove release construction left source checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --check origin/main...HEAD
