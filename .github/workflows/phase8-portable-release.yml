name: Phase 8 Portable Release

on:
  pull_request:
    branches: [main]
    paths:
      - "release/**"
      - "tools/build_phase8_release.py"
      - "tools/prove_phase8_release.py"
      - "python/tests/test_phase8_release.py"
      - "python/tests/test_phase8_release_schema_contract.py"
      - "rust/**"
      - "python/**"
      - "workspace/**"
      - ".github/workflows/phase8-portable-release.yml"
  push:
    branches: [build/phase8-portable-release]
    paths:
      - "release/**"
      - "tools/build_phase8_release.py"
      - "tools/prove_phase8_release.py"
      - "python/tests/test_phase8_release.py"
      - "python/tests/test_phase8_release_schema_contract.py"
      - "rust/**"
      - "python/**"
      - "workspace/**"
      - ".github/workflows/phase8-portable-release.yml"

permissions:
  contents: read

jobs:
  portable-release-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_DATE_EPOCH: "315532800"
      TZ: UTC
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact reviewed revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_SHA}"

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"

      - name: Set up Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Pin Python release test/build environment
        run: >-
          python -m pip install --disable-pip-version-check
          "pip==26.2.1" "setuptools==84.0.0" "pytest==9.1.1"

      - name: Compile release tooling and tests
        run: >-
          python -m py_compile
          tools/build_phase8_release.py
          tools/prove_phase8_release.py
          python/tests/test_phase8_release.py
          python/tests/test_phase8_release_schema_contract.py

      - name: Run canonical release contract and adversarial tests
        run: >-
          python -m pytest -q
          python/tests/test_phase8_release.py
          python/tests/test_phase8_release_schema_contract.py

      - name: Build exact-head portable candidate twice
        shell: bash
        run: |
          set -euo pipefail
          out_a="${RUNNER_TEMP}/origins-phase8-release-a"
          out_b="${RUNNER_TEMP}/origins-phase8-release-b"
          rm -rf "$out_a" "$out_b"
          mkdir -p "$out_a" "$out_b"

          python tools/build_phase8_release.py \
            --output "$out_a" \
            --expected-head "${REVIEWED_SHA}" \
            | tee "${RUNNER_TEMP}/origins-phase8-build-a.json"
          python tools/build_phase8_release.py \
            --output "$out_b" \
            --expected-head "${REVIEWED_SHA}" \
            | tee "${RUNNER_TEMP}/origins-phase8-build-b.json"

          archive_a="$(find "$out_a" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          archive_b="$(find "$out_b" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          checksum_a="$(find "$out_a" -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          checksum_b="$(find "$out_b" -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          test -n "$archive_a" && test -n "$archive_b"
          test -n "$checksum_a" && test -n "$checksum_b"

          test "$(basename "$archive_a")" = "$(basename "$archive_b")"
          test "$(sha256sum "$archive_a" | awk '{print $1}')" = "$(sha256sum "$archive_b" | awk '{print $1}')"
          cmp --silent "$archive_a" "$archive_b"
          test "$(cut -d' ' -f1 "$checksum_a")" = "$(cut -d' ' -f1 "$checksum_b")"

          printf '%s\n' "$archive_a" > "${RUNNER_TEMP}/origins-phase8-archive-path"
          printf '%s\n' "$checksum_a" > "${RUNNER_TEMP}/origins-phase8-checksum-path"

      - name: Independently unpack and prove released runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$(cat "${RUNNER_TEMP}/origins-phase8-archive-path")"
          checksum="$(cat "${RUNNER_TEMP}/origins-phase8-checksum-path")"
          python tools/prove_phase8_release.py \
            --archive "$archive" \
            --checksum "$checksum" \
            --expected-head "${REVIEWED_SHA}" \
            | tee "${RUNNER_TEMP}/origins-phase8-proof.json"

      - name: Prove release construction left source checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${REVIEWED_SHA}"
          test -z "$(git status --porcelain)"
          git diff --check origin/main...HEAD
