name: Apply Phase 7 Durability Hardening

on:
  push:
    branches: [build/phase7-capability-evolution]
    paths:
      - "tools/apply_phase7_durability_hardening.py"
      - ".github/workflows/apply-phase7-durability-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - name: Apply durability hardening
        run: python tools/apply_phase7_durability_hardening.py

      - name: Correct concurrency regression probe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("python/tests/test_phase7_approval_binding.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_concurrent_first_capability_binding_cannot_replace_pending_binding"
          index = text.index(marker)
          text = text[:index] + '''def test_concurrent_first_capability_binding_cannot_replace_pending_binding(tmp_path: Path) -> None:
              import threading

              path = tmp_path / "phase7.sqlite"
              bindings = EvolutionApprovalBindings(path)
              start = threading.Barrier(3)
              errors: list[Exception] = []

              def bind(approval_id: str) -> None:
                  start.wait(timeout=5)
                  try:
                      bindings.bind("evolution-7", evidence(approval_id, "pending"))
                  except Exception as exc:  # expected loser
                      errors.append(exc)

              threads = [threading.Thread(target=bind, args=(approval_id,)) for approval_id in ("approval-a", "approval-b")]
              for thread in threads:
                  thread.start()
              start.wait(timeout=5)
              for thread in threads:
                  thread.join(timeout=5)
              assert all(not thread.is_alive() for thread in threads)
              assert len(errors) == 1
              assert "cannot replace" in str(errors[0])
              stored = EvolutionApprovalBindings(path).get("evolution-7")
              assert stored is not None and stored["approval_id"] in {"approval-a", "approval-b"}
          '''
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify Python hardening
        run: |
          python -m py_compile \
            python/origins_integration/capability_evolution.py \
            python/origins_integration/capability_evolution_approvals.py \
            python/origins_integration/phase7_runtime.py \
            python/tests/test_phase7_approval_binding.py \
            python/tests/test_phase7_capability_evolution.py
          git diff --check
          python -m pip install --disable-pip-version-check -e ./python pytest
          python -m pytest -q python/tests/test_phase7_*.py

      - name: Verify Workspace hardening
        working-directory: workspace
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit durability hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            python/origins_integration/capability_evolution.py \
            python/origins_integration/capability_evolution_approvals.py \
            python/origins_integration/phase7_runtime.py \
            python/tests/test_phase7_approval_binding.py \
            python/tests/test_phase7_capability_evolution.py \
            workspace/src/Phase7App.tsx
          git diff --cached --quiet && { echo "No durability patch required"; exit 0; }
          git commit -m "Phase 7: harden restart and concurrent durability"
          git push origin HEAD:build/phase7-capability-evolution
