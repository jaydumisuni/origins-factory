name: Origins Contract Spine

on:
  pull_request:
    branches: [main]
  push:
    branches: [impl/contract-spine-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: origins-contract-spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Verify Node TypeScript runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major < 22) process.exit(1)'

      - name: Install Python proof dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Compile Python contract package
        run: python -m compileall -q python/origins_contracts python/tests tools/prove_contract_equivalence.py

      - name: Run Python contract proof
        env:
          PYTHONPATH: python
        run: python -m pytest python/tests -q

      - name: Run TypeScript contract proof
        run: node --test typescript/tests/contracts.test.ts

      - name: Reject Rust warnings
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust contract proof
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Build Rust contract proof CLI
        run: cargo build --manifest-path rust/Cargo.toml --bin origins-contracts

      - name: Prove Rust Python TypeScript equivalence
        env:
          PYTHONPATH: python
        run: >-
          python tools/prove_contract_equivalence.py
          --rust-bin rust/target/debug/origins-contracts
          --typescript-cli typescript/contracts-cli.ts

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
