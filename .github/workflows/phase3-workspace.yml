name: Origins Phase 3 Workspace

on:
  push:
    branches:
      - build/phase3-workspace-shell
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: origins-phase3-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve reviewed Workspace graph
        working-directory: workspace
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact Workspace graph
        working-directory: workspace
        run: npm ci --ignore-scripts

      - name: Typecheck Workspace
        working-directory: workspace
        run: npm run typecheck

      - name: Run Workspace unit tests
        working-directory: workspace
        run: npm test

      - name: Build Workspace
        working-directory: workspace
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Generate exact Rust dependency lock
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Normalize reviewed Rust sources
        run: cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Normalized worktree whitespace gate
        run: git diff --check

      - name: Reject Rust warnings
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets

      - name: Build originsd
        run: cargo build --locked --manifest-path rust/Cargo.toml --bin originsd

      - name: Prove bounded Workspace editor and restart recovery
        run: python tools/prove_workspace_editor.py --binary rust/target/debug/originsd

      - name: Committed repository whitespace gate
        run: git diff --check origin/main...HEAD

  freeze-phase3-source:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'build/phase3-workspace-shell' &&
      github.actor == 'jaydumisuni' &&
      !startsWith(github.event.head_commit.message, 'Freeze Phase 3 normalized source')
    needs: workspace-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Freeze exact Workspace dependency graph
        working-directory: workspace
        run: npm install --package-lock-only --ignore-scripts

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0

      - name: Freeze exact Rust graph and normalized sources
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check

      - name: Commit proven normalized source and dependency locks
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- rust workspace/package-lock.json)" ]]; then
            echo "Phase 3 source and dependency graphs are already frozen."
            exit 0
          fi
          git config user.name "THETECHGUY Origins Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add rust workspace/package-lock.json
          git commit -m "Freeze Phase 3 normalized source"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
