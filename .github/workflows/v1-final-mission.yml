name: Origins v1 Final Mission Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/v1_mission_contract.py"
      - "tools/v1_mission_support.py"
      - "tools/v1_mission_candidate.py"
      - "tools/v1_mission_candidate_review.py"
      - "tools/v1_mission_recovery.py"
      - "tools/prove_v1_repository_mission.py"
      - "python/tests/test_v1_repository_mission_contract.py"
      - "python/tests/test_v1_repository_mission_hardening.py"
      - "rust/originsd/src/artifacts.rs"
      - ".github/workflows/v1-final-mission.yml"
  push:
    branches: [proof/v1-final-repository-mission]
    paths:
      - "tools/v1_mission_contract.py"
      - "tools/v1_mission_support.py"
      - "tools/v1_mission_candidate.py"
      - "tools/v1_mission_candidate_review.py"
      - "tools/v1_mission_recovery.py"
      - "tools/prove_v1_repository_mission.py"
      - "python/tests/test_v1_repository_mission_contract.py"
      - "python/tests/test_v1_repository_mission_hardening.py"
      - "rust/originsd/src/artifacts.rs"
      - ".github/workflows/v1-final-mission.yml"

permissions:
  contents: read

jobs:
  contract-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install proof-test dependency
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Compile final Mission prover
        run: >-
          python -m py_compile
          tools/v1_mission_contract.py
          tools/v1_mission_support.py
          tools/v1_mission_candidate.py
          tools/v1_mission_candidate_review.py
          tools/v1_mission_recovery.py
          tools/prove_v1_repository_mission.py
          python/tests/test_v1_repository_mission_contract.py
          python/tests/test_v1_repository_mission_hardening.py

      - name: Prove final Mission contract
        run: >-
          python -m pytest -q
          python/tests/test_v1_repository_mission_contract.py
          python/tests/test_v1_repository_mission_hardening.py

      - name: Assert hosted proof cannot impersonate exact-host acceptance
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'final v1 Mission requires live production Hunter URL/token' tools/prove_v1_repository_mission.py
          grep -F 'ORIGINS_V1_EXPECTED_HEAD is required' tools/prove_v1_repository_mission.py
          grep -F 'standalone_after_hunter_disconnect' tools/v1_mission_recovery.py
          grep -F 'ORIGINS_PHASE7_DAEMON' tools/prove_v1_repository_mission.py
          grep -F 'candidate_artifact_ref' tools/v1_mission_candidate_review.py
          grep -F 'exact_session_identity_recovered' tools/v1_mission_recovery.py
          grep -F 'matches!(owner.as_str(), "lumi" | "origins")' rust/originsd/src/artifacts.rs
          grep -F '"owner": "origins"' tools/v1_mission_support.py
          python - <<'PY'
          from pathlib import Path
          marker = "ORIGINS_V1_" + "REPOSITORY_MISSION_OK"
          workflow = Path(".github/workflows/v1-final-mission.yml").read_text(encoding="utf-8")
          if marker in workflow:
              raise SystemExit("Hosted workflow must not claim live Mission success")
          PY

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD
