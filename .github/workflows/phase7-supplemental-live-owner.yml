name: Phase 7 Supplemental Real Owner Proof

on:
  push:
    branches: [build/phase7-capability-evolution]
    paths:
      - ".github/workflows/phase7-supplemental-live-owner.yml"

permissions:
  contents: read

jobs:
  strict-real-owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed Phase 7 revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare exact owner checkouts
        run: |
          sudo mkdir -p /home/kratos
          sudo chown "$USER":"$USER" /home/kratos
          git clone --quiet https://github.com/jaydumisuni/Hunter-AgentOps /home/kratos/Hunter-AgentOps
          git -C /home/kratos/Hunter-AgentOps checkout --quiet 054a09e7571b08e5865499d66ea6db5ae6eb43a6
          git clone --quiet https://github.com/jaydumisuni/hunter-codeops /home/kratos/hunter-codeops
          git -C /home/kratos/hunter-codeops checkout --quiet e72afe60ebab41d9f36dc729ad798d5aa4071e83
          git clone --quiet https://github.com/jaydumisuni/Sergeant /home/kratos/Sergeant
          git -C /home/kratos/Sergeant checkout --quiet fe491502a960e6b581a7d07e35683aa28e58b9f8
          test -z "$(git -C /home/kratos/Hunter-AgentOps diff --name-only)"
          test -z "$(git -C /home/kratos/hunter-codeops diff --name-only)"
          test -z "$(git -C /home/kratos/Sergeant diff --name-only)"

      - name: Install exact Python proof plane
        run: |
          python -m pip install --disable-pip-version-check -e ./python pytest
          python -m pip install --disable-pip-version-check -e /home/kratos/hunter-codeops -e /home/kratos/Sergeant

      - name: Build exact originsd
        run: cargo build --manifest-path rust/Cargo.toml -p originsd

      - name: Run strict real-owner lifecycle
        env:
          PYTHONPATH: /home/kratos/Hunter-AgentOps
          ORIGINS_PHASE7_EXPECTED_HEAD: ${{ github.sha }}
          ORIGINS_PHASE7_DAEMON: ${{ github.workspace }}/rust/target/debug/originsd
        run: python tools/prove_phase7_live_owner_strict.py
