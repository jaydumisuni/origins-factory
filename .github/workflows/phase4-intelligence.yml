name: Phase 4 Intelligence Plane

on:
  pull_request:
    paths:
      - "python/origins_integration/**"
      - "python/tests/test_intelligence_*.py"
      - "python/tests/test_phase4_*.py"
      - "tools/prove_phase4_*.py"
      - "workspace/**"
      - ".github/workflows/phase4-intelligence.yml"
  push:
    branches:
      - "build/phase4-intelligence-assurance"
    paths:
      - "python/origins_integration/**"
      - "python/tests/test_intelligence_*.py"
      - "python/tests/test_phase4_*.py"
      - "tools/prove_phase4_*.py"
      - "workspace/**"
      - ".github/workflows/phase4-intelligence.yml"

permissions:
  contents: read

jobs:
  semantic-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile semantic plane and Phase 4 host proofs
        run: >-
          python -m compileall -q python/origins_integration python/tests
          && python -m py_compile
          tools/prove_phase4_agentops_mount.py
          tools/prove_phase4_live_owner_stack.py

      - name: Run Phase 4 semantic proofs
        env:
          PYTHONPATH: python
        run: >-
          python -m pytest -q
          python/tests/test_intelligence_server.py
          python/tests/test_intelligence_approvals.py
          python/tests/test_phase4_durable_operations.py
          python/tests/test_context_refs_and_capability_proposals.py

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workspace
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
