name: Phase 4 Intelligence Plane

on:
  pull_request:
    paths:
      - "python/origins_integration/**"
      - "python/tests/test_intelligence_*.py"
      - "python/tests/test_phase4_*.py"
      - "workspace/**"
      - ".github/workflows/phase4-intelligence.yml"
  push:
    branches:
      - "build/phase4-intelligence-assurance"
    paths:
      - "python/origins_integration/**"
      - "python/tests/test_intelligence_*.py"
      - "python/tests/test_phase4_*.py"
      - "workspace/**"
      - ".github/workflows/phase4-intelligence.yml"

permissions:
  contents: read

jobs:
  semantic-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile semantic plane
        run: python -m compileall -q python/origins_integration python/tests
      - name: Run Phase 4 semantic proofs
        env:
          PYTHONPATH: python
        run: >-
          python -m pytest -q
          python/tests/test_intelligence_server.py
          python/tests/test_intelligence_approvals.py
          python/tests/test_phase4_durable_operations.py
          python/tests/test_capability_proposals.py

  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
