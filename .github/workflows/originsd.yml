name: Origins Daemon Foundation

on:
  push:
    branches: [impl/originsd-foundation-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: originsd-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Generate exact dependency lock
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Compile recovery proof
        run: python -m compileall -q tools/prove_originsd_recovery.py

      - name: Reject Rust warnings
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets

      - name: Build originsd
        run: cargo build --locked --manifest-path rust/Cargo.toml --bin originsd

      - name: Prove auth persistence journal and restart recovery
        run: python tools/prove_originsd_recovery.py --binary rust/target/debug/originsd

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

  freeze-lock:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/impl/originsd-foundation-v1' &&
      github.actor == 'jaydumisuni' &&
      !startsWith(github.event.head_commit.message, 'Freeze originsd dependency lock')
    needs: runtime-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal
          rustup override set 1.75.0

      - name: Generate proven lockfile
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Freeze dependency lock on implementation branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- rust/Cargo.lock)" ]]; then
            echo "Dependency lock is already frozen."
            exit 0
          fi
          git config user.name "THETECHGUY Origins Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "Freeze originsd dependency lock"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:impl/originsd-foundation-v1
