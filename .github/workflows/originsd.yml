name: Origins Daemon Foundation

on:
  push:
    branches:
      - impl/originsd-foundation-v1
      - impl/process-sessions-v1
      - impl/active-session-control-v1
      - impl/live-session-observation-v1
      - impl/repository-git-sessions-v1
      - impl/engineering-assurance-loop-v1
      - impl/production-engineering-mount-v1
      - impl/live-engineering-mount-v1
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: originsd-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.75.0
          rustc --version
          cargo --version

      - name: Generate exact dependency lock
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml

      - name: Compile hosted proofs
        run: >-
          python -m compileall -q
          tools/prove_originsd_recovery.py
          tools/prove_process_sessions.py
          tools/prove_active_session_control.py
          tools/prove_live_session_observation.py
          tools/prove_repository_git_sessions.py
          tools/prove_engineering_assurance_bridge.py
          tools/prove_production_engineering_mount.py
          tools/prove_live_engineering_mount.py

      - name: Reject Rust warnings
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets

      - name: Build originsd
        run: cargo build --locked --manifest-path rust/Cargo.toml --bin originsd

      - name: Prove auth persistence journal and restart recovery
        run: python tools/prove_originsd_recovery.py --binary rust/target/debug/originsd

      - name: Prove supervised process sessions
        run: python tools/prove_process_sessions.py --binary rust/target/debug/originsd

      - name: Prove active Session control and event replay
        run: python tools/prove_active_session_control.py --binary rust/target/debug/originsd

      - name: Prove live Session observation and cursor reconnect
        run: python tools/prove_live_session_observation.py --binary rust/target/debug/originsd

      - name: Prove repository Git sessions
        run: python tools/prove_repository_git_sessions.py --binary rust/target/debug/originsd

      - name: Prove engineering assurance bridge protocol
        run: python tools/prove_engineering_assurance_bridge.py --binary rust/target/debug/originsd

      - name: Prove production engineering mount doctor
        run: python tools/prove_production_engineering_mount.py --binary rust/target/debug/originsd

      - name: Prove live engineering mount smoke
        run: python tools/prove_live_engineering_mount.py --binary rust/target/debug/originsd

      - name: Repository whitespace gate
        run: git diff --check origin/main...HEAD

  normalize-runtime:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/impl/') &&
      github.actor == 'jaydumisuni' &&
      !startsWith(github.event.head_commit.message, 'Normalize Origins runtime')
    needs: runtime-proof
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out proven source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust 1.75
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup override set 1.75.0

      - name: Normalize proven dependency graph and Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Freeze normalized runtime on implementation branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- rust)" ]]; then
            echo "Rust runtime is already normalized."
            exit 0
          fi
          git config user.name "THETECHGUY Origins Freezer"
          git config user.email "actions@users.noreply.github.com"
          git add rust
          git commit -m "Normalize Origins runtime"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
